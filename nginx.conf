server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML, JS and CSS: browsers and Cloudflare must check for a newer version
    # on every load (cheap 304 when unchanged), so a redeploy shows up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
