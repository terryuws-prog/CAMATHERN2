server {
    listen 3000;
    server_name _;

    # /camathern/ → CAMATHERN2 容器
    location /camathern/ {
        proxy_pass http://camathern:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /camathern 没有斜杠时自动补上
    location = /camathern {
        return 301 /camathern/;
    }

    # 其他所有请求 → EMWAC 容器
    location / {
        proxy_pass http://emwac:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
