server {
    listen 3000;
    server_name _;

    # /cam/ -> CAMATHERN2 container
    location /cam/ {
        proxy_pass http://camathern:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the old public path working while /cam/ is introduced.
    location /carmarthenshire/ {
        proxy_pass http://camathern:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Sensor ingestion API ---------------------------------------------
    # Upstreams are resolved per request through Docker's DNS, so the proxy
    # (and the rest of the site) still starts if the API containers are down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Production: /cam/api/... -> ingest-api:8000/api/...
    location /cam/api/ {
        set $ingest_api http://ingest-api:8000;
        rewrite ^/cam(/api/.*)$ $1 break;
        proxy_pass $ingest_api;
        client_max_body_size 900k;   # below the API's own 1 MB limit, so oversize gets a clean 413
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development: /cam/dev/... -> ingest-api-dev:8000/... (includes /docs)
    location /cam/dev/ {
        set $ingest_api_dev http://ingest-api-dev:8000;
        rewrite ^/cam/dev(/.*)$ $1 break;
        proxy_pass $ingest_api_dev;
        client_max_body_size 900k;   # below the API's own 1 MB limit, so oversize gets a clean 413
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Add the trailing slash so relative assets resolve under /cam/.
    location = /cam {
        return 301 /cam/;
    }

    location = /carmarthenshire {
        return 301 /carmarthenshire/;
    }

    # All other requests -> new EMWAC container
    location / {
        proxy_pass http://new-emwac:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
