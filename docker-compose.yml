services:
  # nginx 反向代理 — 唯一对外暴露 3000 的入口
  proxy:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - emwac
      - camathern
    restart: unless-stopped

  # 原有 EMWAC 项目 — 内部访问，不对外暴露端口
  emwac:
    image: emwac/emwac:v7.0
    restart: unless-stopped

  # CAMATHERN2 — 内部访问，不对外暴露端口
  camathern:
    build: .
    restart: unless-stopped
