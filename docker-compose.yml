services:
  # nginx reverse proxy: the only public listener on 3000.
  proxy:
    build: ./proxy
    ports:
      - "3000:3000"
    depends_on:
      - new-emwac
      - camathern
    restart: unless-stopped

  # New EMWAC app: internal only, reached through proxy.
  new-emwac:
    image: emwac-web:latest
    pull_policy: never
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped

  # CAMATHERN2: internal only, reached through proxy at /cam/.
  camathern:
    build: .
    expose:
      - "80"
    restart: unless-stopped
